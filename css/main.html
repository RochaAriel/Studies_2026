<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Listas e Cadastro</title>
</head>
<body>
    <main>
        <section>
            <h2>Lista ordenada</h2>
            <ol>
                <li>Estudar HTML</li>
                <li>Praticar CSS</li>
                <li>Aprender JavaScript</li>
                <li>Resolver exercícios</li>
                <li>Revisar o conteúdo</li>
            </ol>
        </section>

        <section>
            <h2>Lista não ordenada</h2>
            <ul>
                <li>Casa</li>
                <li>Escola</li>
                <li>Trabalho</li>
                <li>Amigos</li>
                <li>Projetos</li>
            </ul>
        </section>

        <section>
            <h2>Formulário de cadastro</h2>
            <form>
                <label>Nome:</label>
                <input class="formulario"  type="text" placeholder="Digite seu nome">

                <label for="email">E-mail:</label>
                <input class="formulario" type="email" id="email" placeholder="Digite seu e-mail">

                <label>Senha:</label>
                <input class="formulario" type="password" placeholder="Crie uma senha">
                    <br>
                <button  type="submit">Cadastrar</button>
            </form>
        </section>
    </main>
</body>
</html>
