<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<!-- 
 Formularios  
 

O for="campo-nome" no label diz: "eu sou rótulo de quem?"
O id="campo-nome" no input diz: "eu sou esse campo"
 
-->

    <form action="Cadastro">
        
    <div>
        <label for="name"> Seu nome: </label> <br>
        <input type="text" id="name" placeholder=" Digite seu nome ">
    </div>
    
    <div>
        <label for="email"> Seu email: </label> <br>
        <input type="email" id="email" placeholder=" Digite seu email ">
    </div>
    
    <div>
        <label for="mensagem">Digite sua mensagem</label> <br>
        <textarea name="mensagem" id="mensagem" cols="30" rows="10" placeholder="Digite sua mensagem"></textarea>
    </div>
    
    
    </form>
</body>
</html>
